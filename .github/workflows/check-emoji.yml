# custom_emoji_id 가 유효한지·움직이는지 조회하는 진단 유틸.
# Actions -> "Check custom emoji" -> Run workflow (ids 비우면 후보들 자동 조회).
name: Check custom emoji

on:
  workflow_dispatch:
    inputs:
      ids:
        description: "공백으로 구분한 custom_emoji_id 들(비우면 기본 후보)"
        required: false
        type: string

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Check
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          IDS: ${{ inputs.ids }}
        run: |
          python3 scripts/check_emoji.py ${IDS:-5395695537687123235 5213285132709929474 5220108512893344933 5217943819311389632 5215557810359639942}
