# 텔레그램 테스트 메시지 수동 발송 유틸.
# Actions -> "Send test telegram" -> Run workflow 로 실행하면 채널에 테스트 메시지 1건을
# 보내고, 로그에서 사이렌 커스텀 이모지 수락 여부(ok / ok_plain)를 알려준다.
name: Send test telegram

on:
  workflow_dispatch:
    inputs:
      message:
        description: "보낼 메시지(비우면 기본 테스트 문구, 🚨 포함)"
        required: false
        type: string

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Send
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: python3 scripts/send_test.py "${{ inputs.message }}"
