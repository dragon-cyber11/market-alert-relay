# 저장 위치: .github/workflows/fj-ws-probe.yml
# 인베스팅 경제일정 위젯 구조 확인 (수동 실행 전용)
# - 결과: .state/inv_probe.txt, .state/inv_widget.html
# - 텔레그램 전송 안 함. 기존 릴레이에 영향 없음. 30초면 끝남
name: FJ WebSocket Probe

on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Probe
        run: |
          mkdir -p .state
          python3 scripts/fj_ws_probe.py 2>&1 | tail -300 | tee .state/fj_ws_probe_log.txt

      - name: Commit results
        if: always()
        run: |
          git config user.name "relay-bot"
          git config user.email "relay-bot@users.noreply.github.com"
          for f in .state/inv_probe.txt .state/inv_widget.html .state/fj_ws_probe_log.txt; do
            [ -f "$f" ] && git add "$f"
          done
          git commit -m "investing calendar probe" || echo "커밋할 변경사항 없음"
          for i in 1 2 3 4 5; do
            if git push; then
              break
            fi
            git fetch origin main
            git rebase origin/main || git rebase --abort
            sleep 2
          done
