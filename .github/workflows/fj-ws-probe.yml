# 저장 위치: .github/workflows/fj-ws-probe.yml
# FinancialJuice 웹소켓 탐사 v2 (브라우저 방식, 수동 실행 전용)
# - 헤드리스 크롬으로 사이트를 실제로 열어서 웹소켓 송수신 데이터를 전부 수집
# - 결과: .state/fj_ws_sample.jsonl + .state/fj_ws_probe_log.txt 로 커밋
# - 텔레그램 전송은 하지 않음. 기존 릴레이에 영향 없음
name: FJ WebSocket Probe

on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install playwright + chromium
        run: |
          pip install playwright || pip install --break-system-packages playwright
          python3 -m playwright install --with-deps chromium

      - name: Capture browser websocket traffic (8 min)
        run: |
          mkdir -p .state
          rm -f .state/fj_ws_sample.jsonl
          python3 scripts/fj_ws_probe.py 480 2>&1 | tee .state/fj_ws_probe_log.txt

      - name: Commit captured sample
        if: always()
        run: |
          git config user.name "relay-bot"
          git config user.email "relay-bot@users.noreply.github.com"
          [ -f .state/fj_ws_sample.jsonl ] && git add .state/fj_ws_sample.jsonl
          [ -f .state/fj_ws_probe_log.txt ] && git add .state/fj_ws_probe_log.txt
          git commit -m "fj websocket probe sample (v2 browser)" || echo "커밋할 변경사항 없음"
          for i in 1 2 3 4 5; do
            if git push; then
              break
            fi
            git fetch origin main
            git rebase origin/main || git rebase --abort
            sleep 2
          done
