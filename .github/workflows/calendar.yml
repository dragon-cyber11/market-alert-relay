# 저장 위치: .github/workflows/calendar.yml
#
# 경제일정 발송.
#   한국 06:25  = UTC 21:25
#   미동부 06:25 = UTC 10:25(서머타임) / 11:25(겨울)
#   주간(월 06:00) = 일요일 UTC 21:00
#
# 깃허브 예약은 수십 분씩 밀리는 일이 흔해서 슬롯마다 예비 시각을 더 걸어둔다.
# 여러 번 깨어나도 스크립트가 .state/cal_sent.json 을 보고 슬롯별 하루 한 번만 보낸다.
name: Economic Calendar

# 정규 발송은 FJ 릴레이 루프(calendar_relay.tick)가 한다. 예약 실행이 몇 시간씩
# 밀리거나 빠져서(11월 실측: 한국 아침 3~6시간 지연·누락, 미국 아침 10/25 이후 0회)
# 여기는 수동 실행(미리보기·테스트·강제 발송)용으로만 남긴다.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: '실행 방식'
        type: choice
        default: dry
        options: [dry, test, weekly-dry, weekly-test, normal]

permissions:
  contents: write

concurrency:
  group: economic-calendar
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      # 예약 잡은 대기열에 들어간 시점의 저장소 상태로 시작한다.
      # 밀려서 늦게 실행되면 옛날 상태로 도는 문제가 있어 최신으로 맞춘다.
      - name: Sync to latest
        run: |
          git fetch origin main
          git reset --hard origin/main

      - name: Post calendar
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          # LLM 번역(선택). 없으면 구글 번역 체인만 쓴다.
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          MODE="${{ github.event.inputs.mode }}"
          [ -z "$MODE" ] && MODE=normal
          python3 scripts/calendar_relay.py "$MODE"

      - name: Commit state
        if: always()
        run: |
          [ -f .state/cal_sent.json ] || exit 0
          git config user.name "relay-bot"
          git config user.email "relay-bot@users.noreply.github.com"
          for i in 1 2 3 4 5; do
            git add .state/cal_sent.json
            git commit -m "calendar state" || true
            if git push; then
              echo "상태 저장 완료"
              exit 0
            fi
            # 릴레이 잡이 동시에 커밋하는 중일 수 있음.
            # rebase 는 상태파일에서 충돌나면 영영 막히므로 쓰지 않는다.
            git fetch origin main
            git reset --mixed origin/main
            sleep 3
          done
          echo "상태 저장 실패 (다음 실행에서 재시도)"
