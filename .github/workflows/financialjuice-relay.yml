# 저장 위치: 저장소에 파일 두 개를 추가해야 합니다.
#   1) .github/workflows/financialjuice-relay.yml  (이 파일)
#   2) scripts/financialjuice_relay.py              (같이 드린 파이썬 파일, 경로 그대로 scripts 폴더 아래)
#
# 하는 일:
#   - 잡(job)이 시작되면 약 5시간 30분 동안 "1초마다 새 속보 확인 -> 있으면 텔레그램 전송"을
#     계속 반복하는 방식으로 동작. 파이썬 프로세스를 10분씩 살려두고 그 안에서 돌기 때문에
#     매번 새로 띄우던 시작 비용이 없어져 반응이 더 빠름
#   - GitHub Actions는 잡 하나를 무한정 돌릴 수는 없어서(호스팅 러너 최대 6시간),
#     약 5시간 30분마다 다음 잡으로 넘겨야 함(잡 타임아웃 355분 안에 인계까지 끝내야 하므로
#     마감을 넉넉히 앞당겨 둠). 인계 방식은 두 겹으로 되어 있음:
#
#       (1) 주 방식 - 자기가 직접 다음 잡을 띄움.
#           루프가 끝나면 gh workflow run 으로 다음 잡을 직접 호출함. concurrency 때문에
#           지금 잡이 완전히 끝난 뒤에 시작되므로 겹치지 않고, 예약 스케줄러를 거치지 않아
#           밀릴 일이 없음. 인계 공백이 러너 부팅 시간(30초~2분) 수준.
#
#       (2) 보험 - 15분 간격 예약(cron).
#           잡이 갑자기 죽어서 (1)을 실행하지 못한 경우를 대비. 다만 GitHub 무료 예약은
#           부하가 몰리면 수십 분~수 시간씩 밀리거나 건너뛰기 때문에 여기에만 의존하면 안 됨.
#           (실제로 예약에만 맡겼을 때 잡 종료 후 2~4시간 공백이 반복해서 발생했음)
#           예약 시각을 7/23/37/53분(소수)으로 잡은 것도 정시 혼잡을 피하기 위함.
#
#     추가로 relay-watchdog.yml 이 밖에서 지켜보다가 25분 넘게 기록이 없으면
#     알림을 보내고 새 잡을 띄움.
#   - 진행 중 상태(마지막으로 보낸 뉴스 번호)는 10분에 한 번씩 저장소에 커밋해서, 잡이 도중에
#     죽어도 최근 상태를 잃지 않게 함
#
# [중요] 대기열에 오래 서 있던 잡은 '예약이 걸린 시점'의 저장소 상태를 받아옴.
#   2시간 대기했다면 2시간 전 상태(=오래된 마지막 뉴스 번호)로 시작해서 이미 보낸 뉴스를
#   다시 보내게 됨. 그래서 checkout 에 ref: main 을 주고, 시작 직후 원격 최신으로 강제로
#   맞춘 뒤에 루프를 돈다.
#
# 참고: 이 워크플로를 처음 추가하고 실행하면 "초기화"만 하고 아무것도 보내지 않습니다.
#
# 필요한 저장소 secret (이미 있음, 추가 설정 불필요):
#   - TELEGRAM_BOT_TOKEN
# (번역은 가입/키 필요 없는 비공식 구글 번역 엔드포인트를 사용함)

name: FinancialJuice RSS to Telegram

on:
  schedule:
    - cron: '7,23,37,53 * * * *'   # 15분 간격, 혼잡한 정시를 피한 소수 분 (겹치면 대기)
  workflow_dispatch: {}

permissions:
  contents: write
  actions: write        # 잡이 끝나기 전에 다음 잡을 직접 띄우기 위해 필요

concurrency:
  group: financialjuice-relay
  cancel-in-progress: false

jobs:
  relay:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main          # 대기열에 오래 있었어도 '실행 시점'의 최신 상태를 받아옴

      - name: Poll feed continuously and send new items to Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          git config user.name "relay-bot"
          git config user.email "relay-bot@users.noreply.github.com"

          # 대기 시간이 길었을 경우를 대비해 원격 최신 상태로 한 번 더 강제 정렬
          git fetch origin main
          git reset --hard origin/main

          mkdir -p .state

          # [주의] 이 값은 위의 timeout-minutes(355분)보다 충분히 작아야 함.
          # 예전에는 350분이었는데, 마감 시각을 통과한 마지막 반복이 파이썬을 600초 더 돌려서
          # 종료가 360분쯤이 됐음. 그러면 timeout 이 먼저 걸려 스텝이 죽고, 아래의
          # "다음 잡 직접 띄우기"가 실행되지 않아 인계가 끊김(예약 cron 이 밀리면 몇 시간 공백).
          # 이제 마감을 330분으로 잡고, 아래에서 남은 시간에 맞춰 파이썬 구간 길이를 줄임.
          END=$(( $(date +%s) + 5*3600 + 30*60 ))   # 약 5시간 30분 동안 반복

          while :; do
            REMAIN=$(( END - $(date +%s) ))
            # 남은 시간이 한 구간을 돌리기에 너무 짧으면 여기서 끝내고 인계로 넘어감
            if [ "$REMAIN" -lt 120 ]; then
              break
            fi
            CHUNK=600
            if [ "$REMAIN" -lt "$CHUNK" ]; then
              CHUNK="$REMAIN"
            fi

            # 파이썬이 CHUNK 초(기본 10분) 동안 안에서 1초 간격으로 돌다가 스스로 종료함.
            # 종료할 때마다 여기서 상태를 커밋하고 다시 띄움 (커밋 주기 = 약 10분, 이전과 동일)
            python3 scripts/financialjuice_relay.py "$CHUNK" || echo "이번 구간 오류 발생, 계속 진행"

            # 원격 최신으로 브랜치 포인터만 맞추고(작업 파일은 그대로 둔 채) 상태 파일만 커밋.
            # rebase 를 쓰면 상태 파일에서 충돌이 나 커밋이 영영 안 올라가는 일이 생겨서 이 방식.
            PUSH_OK=0
            for i in 1 2 3; do
              git fetch origin main -q || true
              git reset --mixed origin/main -q || true
              # 파일마다 따로 add. 한 번에 나열하면 셋 중 하나라도 없을 때(첫 배포 직후엔
              # fj_sent_titles.json 이 없음) git add 가 통째로 실패해서 상태 커밋이 조용히 사라짐
              for f in .state/fj_last_newsid.txt .state/fj_heartbeat.txt .state/fj_sent_titles.json .state/cal_prealert.json; do
                if [ -f "$f" ]; then git add "$f"; fi
              done
              if git diff --cached --quiet; then
                PUSH_OK=1
                break
              fi
              git commit -q -m "financialjuice heartbeat + state update" || break
              if git push -q; then
                PUSH_OK=1
                break
              fi
              echo "push 실패, 원격 최신 반영 후 재시도 ($i)"
              sleep 2
            done

            # 코드가 도중에 갱신됐으면 다음 10분 구간부터 새 코드로 돎.
            # 단 push 가 실패했다면 --hard 를 쓰면 안 됨. 아직 못 올린 상태 파일이
            # 원격의 옛 내용으로 되돌아가서, 이미 보낸 뉴스를 다시 보내게 됨.
            git fetch origin main -q || true
            if [ "$PUSH_OK" = "1" ]; then
              git reset --hard origin/main -q || true
            else
              echo "상태 push 실패, 로컬 상태 유지(다음 구간에서 다시 시도)"
              git reset --mixed origin/main -q || true
            fi
          done

          echo "이번 잡의 실행 시간 한도(약 5시간 30분)에 도달, 다음 잡을 직접 띄움"

          # 예약(cron)에만 맡기면 무료 티어 스케줄러가 밀려서 몇 시간씩 공백이 생김.
          # 그래서 끝나기 직전에 다음 잡을 직접 호출함. concurrency 때문에 이 잡이
          # 완전히 끝난 뒤에 시작되므로 겹치지 않음.
          for i in 1 2 3; do
            if GH_TOKEN="${{ github.token }}" gh workflow run financialjuice-relay.yml --ref main; then
              echo "다음 잡 예약 완료"
              break
            fi
            echo "다음 잡 예약 실패, 재시도 ($i)"
            sleep 5
          done

      - name: Save state (final)
        if: always()
        run: |
          git config user.name "relay-bot"
          git config user.email "relay-bot@users.noreply.github.com"

          for i in 1 2 3 4 5; do
            git fetch origin main || true
            git reset --mixed origin/main || true
            [ -f .state/fj_last_newsid.txt ] && git add .state/fj_last_newsid.txt
            [ -f .state/fj_heartbeat.txt ] && git add .state/fj_heartbeat.txt
            [ -f .state/fj_sent_titles.json ] && git add .state/fj_sent_titles.json
            [ -f .state/cal_prealert.json ] && git add .state/cal_prealert.json
            if git diff --cached --quiet; then
              echo "커밋할 변경사항 없음"
              break
            fi
            git commit -m "financialjuice heartbeat + state update (final)" || break
            if git push; then
              break
            fi
            echo "push 실패, 원격 최신 반영 후 재시도 ($i)"
            sleep 2
          done
