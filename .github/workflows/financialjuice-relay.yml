# 저장 위치: 저장소에 파일 두 개를 추가해야 합니다.
#   1) .github/workflows/financialjuice-relay.yml  (이 파일)
#   2) scripts/financialjuice_relay.py              (같이 드린 파이썬 파일, 경로 그대로 scripts 폴더 아래)
#
# 하는 일:
#   - 잡(job)이 시작되면 약 5시간 50분 동안 "5초마다 새 속보 확인 -> 있으면 텔레그램 전송"을
#     계속 반복하는 방식으로 동작
#   - GitHub Actions는 잡 하나를 무한정 돌릴 수는 없어서(호스팅 러너 최대 6시간),
#     15분 간격으로 예약(cron)을 걸어둠. 잡이 돌고 있는 동안 뜬 예약은 실행되지 않고 '대기'
#     상태로 줄을 서고(concurrency 설정), 돌던 잡이 끝나는 순간 대기 중이던 잡이 바로 이어받음.
#     -> 인계 공백이 러너 부팅 시간(30초 안팎)까지 줄어들고,
#        잡이 예기치 않게 죽어도 15분 안에 자동으로 되살아남
#     예약 시각을 7/23/37/53분(소수)으로 잡은 이유: 정시(:00)와 :30에는 전 세계 예약 잡이
#     한꺼번에 몰려서 GitHub 무료 러너 배정이 몇 분씩 밀리는 일이 잦음. 한적한 분으로 피해감.
#   - 진행 중 상태(마지막으로 보낸 뉴스 번호)는 10분에 한 번씩 저장소에 커밋해서, 잡이 도중에
#     죽어도 최근 상태를 잃지 않게 함
#
# [중요] 대기열에 오래 서 있던 잡은 '예약이 걸린 시점'의 저장소 상태를 받아옴.
#   2시간 대기했다면 2시간 전 상태(=오래된 마지막 뉴스 번호)로 시작해서 이미 보낸 뉴스를
#   다시 보내게 됨. 그래서 checkout 에 ref: main 을 주고, 시작 직후 원격 최신으로 강제로
#   맞춘 뒤에 루프를 돈다.
#
# 참고: 이 워크플로를 처음 추가하고 실행하면 "초기화"만 하고 아무것도 보내지 않습니다.
#
# 필요한 저장소 secret (이미 있음, 추가 설정 불필요):
#   - TELEGRAM_BOT_TOKEN
# (번역은 가입/키 필요 없는 비공식 구글 번역 엔드포인트를 사용함)

name: FinancialJuice RSS to Telegram

on:
  schedule:
    - cron: '7,23,37,53 * * * *'   # 15분 간격, 혼잡한 정시를 피한 소수 분 (겹치면 대기)
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: financialjuice-relay
  cancel-in-progress: false

jobs:
  relay:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main          # 대기열에 오래 있었어도 '실행 시점'의 최신 상태를 받아옴

      - name: Poll feed continuously and send new items to Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          git config user.name "relay-bot"
          git config user.email "relay-bot@users.noreply.github.com"

          # 대기 시간이 길었을 경우를 대비해 원격 최신 상태로 한 번 더 강제 정렬
          # (여기서 코드도 최신으로 갱신되므로, 도는 중에 고친 코드가 다음 주기부터 바로 적용됨)
          git fetch origin main
          git reset --hard origin/main

          mkdir -p .state

          END=$(( $(date +%s) + 5*3600 + 50*60 ))   # 약 5시간 50분 동안 반복
          CYCLE=0

          while [ "$(date +%s)" -lt "$END" ]; do
            python3 scripts/financialjuice_relay.py || echo "이번 주기 오류 발생, 다음 주기에 계속 진행"

            CYCLE=$((CYCLE + 1))

            # 120주기(5초 x 120 = 약 10분)마다 상태를 저장소에 커밋
            # (더 자주 하면 저장소에 커밋만 수만 개 쌓여서 나중에 무거워짐)
            if [ $((CYCLE % 120)) -eq 0 ]; then
              # 원격 최신으로 브랜치 포인터만 맞추고(작업 파일은 그대로 둔 채) 상태 파일만 커밋.
              # rebase 를 쓰면 상태 파일에서 충돌이 나 커밋이 영영 안 올라가는 일이 생겨서 이 방식으로 바꿈.
              for i in 1 2 3; do
                git fetch origin main -q || true
                git reset --mixed origin/main -q || true
                git add .state/fj_last_newsid.txt .state/fj_heartbeat.txt .state/fj_sent_titles.json 2>/dev/null || true
                if git diff --cached --quiet; then
                  break
                fi
                git commit -q -m "financialjuice heartbeat + state update" || break
                if git push -q; then
                  break
                fi
                echo "push 실패, 원격 최신 반영 후 재시도 ($i)"
                sleep 2
              done
            fi

            sleep 5
          done

          echo "이번 잡의 실행 시간 한도(약 5시간 50분)에 도달, 종료 (다음 예약 잡이 바로 이어받음)"

      - name: Save state (final)
        if: always()
        run: |
          git config user.name "relay-bot"
          git config user.email "relay-bot@users.noreply.github.com"

          for i in 1 2 3 4 5; do
            git fetch origin main || true
            git reset --mixed origin/main || true
            [ -f .state/fj_last_newsid.txt ] && git add .state/fj_last_newsid.txt
            [ -f .state/fj_heartbeat.txt ] && git add .state/fj_heartbeat.txt
            [ -f .state/fj_sent_titles.json ] && git add .state/fj_sent_titles.json
            if git diff --cached --quiet; then
              echo "커밋할 변경사항 없음"
              break
            fi
            git commit -m "financialjuice heartbeat + state update (final)" || break
            if git push; then
              break
            fi
            echo "push 실패, 원격 최신 반영 후 재시도 ($i)"
            sleep 2
          done
