# 저장 위치: 저장소 안에 .github/workflows/relay.yml 로 커밋해야 GitHub Actions가 인식합니다.
#
# 하는 일: 매시간 정각에
#   1) 슬랙 #일반 채널의 가장 최근 메시지를 확인
#   2) 그 메시지를 이미 텔레그램으로 보낸 적 있으면(직전과 동일하면) 아무것도 안 하고 종료
#   3) 새로운 메시지면 국기 이모지 코드(:us: 등) 변환 + 슬랙 앱 꼬리표 문구 제거 후 텔레그램으로 전달
#      하고, 저장소에 "마지막으로 보낸 메시지" 기록을 남겨서 다음 실행 때 중복 방지에 사용
#
# 필요한 저장소 secrets (Settings > Secrets and variables > Actions):
#   - SLACK_BOT_TOKEN     : 슬랙 앱의 Bot User OAuth Token (xoxb-...)
#   - TELEGRAM_BOT_TOKEN  : 8516874432:AAGi9Oti8xLftkJ5Y2nTif4Jd-MJlbhKIpQ

name: Slack to Telegram Relay

on:
  schedule:
    - cron: '0 * * * *'   # 매시간 정각 (하루 24번 체크, 새 내용 있을 때만 전송)
  workflow_dispatch: {}   # Actions 탭에서 수동 실행도 가능

permissions:
  contents: write   # 마지막으로 보낸 메시지 기록을 저장소에 커밋하기 위해 필요

jobs:
  relay:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch latest Slack message and check duplicate
        id: slack
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_CHANNEL_ID: C0BK4EUF1C4
        run: |
          set -e
          RESPONSE=$(curl -s -H "Authorization: Bearer $SLACK_BOT_TOKEN" \
            "https://slack.com/api/conversations.history?channel=$SLACK_CHANNEL_ID&limit=1")

          OK=$(echo "$RESPONSE" | jq -r '.ok')
          if [ "$OK" != "true" ]; then
            echo "Slack API 오류:"
            echo "$RESPONSE"
            exit 1
          fi

          MSG_TS=$(echo "$RESPONSE" | jq -r '.messages[0].ts')
          TEXT=$(echo "$RESPONSE" | jq -r '.messages[0].text')

          if [ -z "$TEXT" ] || [ "$TEXT" == "null" ]; then
            echo "가져올 메시지가 없습니다. 건너뜀."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          LAST_TS=""
          if [ -f .state/last_ts.txt ]; then
            LAST_TS=$(cat .state/last_ts.txt)
          fi

          if [ "$MSG_TS" == "$LAST_TS" ]; then
            echo "이미 전송한 메시지와 동일함 (ts: $MSG_TS) - 건너뜀"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "skip=false" >> "$GITHUB_OUTPUT"

          # 슬랙 앱 전송 꼬리표 문구 줄 제거 (예: "*다음을 사용하여 보냄* Claude")
          TEXT=$(echo "$TEXT" | sed '/다음을 사용하여 보냄/d')

          # 슬랙의 국기 이모지 콜론 코드 -> 실제 유니코드 이모지로 변환
          TEXT=$(echo "$TEXT" | sed \
            -e 's/:us:/🇺🇸/g' \
            -e 's/:flag-us:/🇺🇸/g' \
            -e 's/:eu:/🇪🇺/g' \
            -e 's/:flag-eu:/🇪🇺/g' \
            -e 's/:gb:/🇬🇧/g' \
            -e 's/:uk:/🇬🇧/g' \
            -e 's/:flag-gb:/🇬🇧/g' \
            -e 's/:jp:/🇯🇵/g' \
            -e 's/:flag-jp:/🇯🇵/g' \
            -e 's/:cn:/🇨🇳/g' \
            -e 's/:flag-cn:/🇨🇳/g' \
            -e 's/:kr:/🇰🇷/g' \
            -e 's/:flag-kr:/🇰🇷/g' \
            -e 's/:de:/🇩🇪/g' \
            -e 's/:fr:/🇫🇷/g')

          printf '%s' "$TEXT" > message.txt
          echo "$MSG_TS" > new_ts.txt
          echo "---- 가져온 메시지 ----"
          cat message.txt

      - name: Send to Telegram
        if: steps.slack.outputs.skip != 'true'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: "@haesunking"
        run: |
          set -e
          TEXT=$(cat message.txt)
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d chat_id="${TELEGRAM_CHAT_ID}" \
            --data-urlencode text="${TEXT}" \
            -o telegram_response.json

          echo "---- 텔레그램 응답 ----"
          cat telegram_response.json

          OK=$(cat telegram_response.json | jq -r '.ok')
          if [ "$OK" != "true" ]; then
            echo "텔레그램 전송 실패"
            exit 1
          fi

      - name: Save last sent state
        if: steps.slack.outputs.skip != 'true'
        run: |
          mkdir -p .state
          mv new_ts.txt .state/last_ts.txt
          git config user.name "relay-bot"
          git config user.email "relay-bot@users.noreply.github.com"
          git add .state/last_ts.txt
          git commit -m "update last sent message marker" || echo "커밋할 변경사항 없음"
          git push
