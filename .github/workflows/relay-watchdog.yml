# 저장 위치: .github/workflows/relay-watchdog.yml
#
# 릴레이 감시견(watchdog).
#   릴레이 잡은 스스로 죽으면 스스로 신고할 수가 없음. 그래서 밖에서 따로 지켜보는 역할.
#
# 15분마다 잠깐 돌면서 릴레이가 마지막으로 남긴 기록(.state/fj_heartbeat.txt) 시각을 보고,
# 30분 넘게 갱신이 없으면 상황에 따라 이렇게 함:
#
#   - 릴레이 잡이 아예 안 돌고 있음      -> 알림 + 새 잡 띄움
#   - 릴레이 잡이 돌긴 하는데 오래됐고 응답 없음 -> 알림 + 그 잡 종료 후 새 잡 띄움
#   - 릴레이 잡이 방금 시작함(20분 미만) -> 아무것도 안 함
#
# 마지막 조건이 중요함. 릴레이는 상태를 10분에 한 번만 저장하기 때문에, 막 시작한 잡은
# 아직 기록을 안 남긴 상태임. 이때 기록이 오래됐다고 잡을 죽여버리면 멀쩡한 잡을 계속
# 재시작시키는 무한 루프에 빠지고, 그 과정에서 이미 보낸 뉴스가 다시 나가게 됨.
#
# 필요한 secret: TELEGRAM_BOT_TOKEN (이미 있음)

name: Relay Watchdog

on:
  schedule:
    - cron: '11,29,41,59 * * * *'   # 릴레이 예약(7/23/37/53)과 겹치지 않게 어긋난 분에 실행
  workflow_dispatch: {}

permissions:
  contents: read
  actions: write        # 멈춘 잡을 종료하고 새 잡을 띄우려면 필요

concurrency:
  group: relay-watchdog   # 릴레이와 다른 그룹이어야 서로 안 막음
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Check relay heartbeat
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          GH_TOKEN: ${{ github.token }}
          STALE_MINUTES: '30'      # 기록이 이만큼 오래되면 이상으로 판단
          GRACE_MINUTES: '20'      # 시작한 지 이만큼 안 된 잡은 건드리지 않음
        run: |
          HB=.state/fj_heartbeat.txt
          NOW=$(date -u +%s)

          # ---------- 1) 지금 돌고 있는 릴레이 잡이 있는지, 언제 시작했는지 ----------
          RUNS=$(gh run list \
                   --workflow financialjuice-relay.yml \
                   --status in_progress \
                   --limit 5 --json databaseId,createdAt \
                   --jq '.[] | "\(.databaseId) \(.createdAt)"' || true)

          NEWEST_AGE=999999
          if [ -n "$RUNS" ]; then
            while read -r ID CREATED; do
              [ -z "$ID" ] && continue
              C=$(date -u -d "$CREATED" +%s 2>/dev/null || echo 0)
              [ "$C" -eq 0 ] && continue
              AGE=$(( (NOW - C) / 60 ))
              echo "진행 중인 잡 $ID : 시작한 지 ${AGE}분"
              [ "$AGE" -lt "$NEWEST_AGE" ] && NEWEST_AGE=$AGE
            done <<< "$RUNS"
          else
            echo "진행 중인 릴레이 잡 없음"
          fi

          # 방금 시작한 잡이 있으면 아직 기록을 남길 시간이 없었던 것 -> 그냥 둠
          if [ "$NEWEST_AGE" -lt "$GRACE_MINUTES" ]; then
            echo "시작한 지 ${NEWEST_AGE}분밖에 안 된 잡이 있음 (유예 ${GRACE_MINUTES}분). 개입 안 함"
            exit 0
          fi

          # ---------- 2) 마지막 동작 기록이 얼마나 오래됐는지 ----------
          if [ ! -f "$HB" ]; then
            echo "하트비트 파일이 없음 - 아직 한 번도 안 돌았거나 경로가 바뀜"
            exit 0
          fi
          echo "하트비트 내용: $(cat $HB)"

          TS=$(awk '{print $1}' "$HB")           # 예: 2026-07-30T03:46:43Z
          LAST=$(date -u -d "$TS" +%s 2>/dev/null || echo 0)
          if [ "$LAST" -eq 0 ]; then
            echo "시각을 읽지 못함: $TS"
            exit 0
          fi

          AGE_MIN=$(( (NOW - LAST) / 60 ))
          echo "마지막 갱신으로부터 ${AGE_MIN}분 경과 (기준 ${STALE_MINUTES}분)"

          if [ "$AGE_MIN" -lt "$STALE_MINUTES" ]; then
            echo "정상"
            exit 0
          fi

          echo "::warning::릴레이가 ${AGE_MIN}분째 멈춰 있음. 알림 후 재시작"

          # ---------- 3) 텔레그램 알림 ----------
          MSG=$(printf '⚠️ 뉴스 릴레이 멈춤\n%d분째 동작 기록이 없습니다.\n자동 재시작을 시도합니다.' "$AGE_MIN")
          curl -s -o /dev/null -X POST \
            "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d chat_id="@haesunking" \
            --data-urlencode text="${MSG}" || echo "텔레그램 알림 실패"

          # ---------- 4) 응답 없는 오래된 잡 정리 ----------
          if [ -n "$RUNS" ]; then
            while read -r ID CREATED; do
              [ -z "$ID" ] && continue
              echo "응답 없는 잡 $ID 종료"
              gh run cancel "$ID" || echo "종료 실패 (이미 끝났을 수 있음)"
            done <<< "$RUNS"
            sleep 20   # 종료 처리가 반영될 때까지 잠깐 기다림
          fi

          # ---------- 5) 새 잡 띄우기 ----------
          for i in 1 2 3; do
            if gh workflow run financialjuice-relay.yml --ref main; then
              echo "릴레이 재시작 요청 완료"
              break
            fi
            echo "재시작 요청 실패, 재시도 ($i)"
            sleep 5
          done
