# 커스텀 이모지 셋에서 사이렌의 custom_emoji_id 를 찾는 일회용 유틸 워크플로.
#
# 쓰는 법(휴대폰에서도 가능):
#   1) 이모지 셋을 열어 '공유' 하면 링크가 t.me/addemoji/<이름> 형태로 나온다.
#      그 <이름>(short_name)을 복사한다.
#   2) GitHub -> Actions -> "Find siren custom emoji id" -> Run workflow ->
#      set_name 칸에 그 이름을 넣고 실행.
#   3) 실행 로그에 각 이모지의 id 가 나온다. '사이렌 후보' 로 표시된 id 를
#      저장소 Secret 'SIREN_CUSTOM_EMOJI_ID' 에 넣으면 릴레이가 그걸 쓴다.
#
# getStickerSet 은 읽기 전용이라 안전하다.
name: Find siren custom emoji id

on:
  workflow_dispatch:
    inputs:
      set_name:
        description: "이모지 셋 short_name (t.me/addemoji/<여기>)"
        required: true
        type: string

jobs:
  find:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: List custom emoji ids
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: python3 scripts/find_custom_emoji.py "${{ inputs.set_name }}"
